version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: aeroskop-postgres
    environment:
      POSTGRES_DB: aeroskop_db
      POSTGRES_USER: aeroskop_user
      POSTGRES_PASSWORD: aeroskop_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroskop_user -d aeroskop_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aeroskop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aeroskop.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
